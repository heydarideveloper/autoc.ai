<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>تنظیمات دستیار هوشمند</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 24px;
        color: #1f2937;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 8px;
        margin-bottom: 16px;
        border: 1px solid #cbd5f5;
        border-radius: 8px;
      }

      button {
        padding: 10px 18px;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .status {
        margin-top: 12px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>تنظیمات اتصال</h1>
    <p>توکن JWT خود را از پنل وب دریافت کرده و در اینجا ذخیره کنید تا افزونه بتواند به اعلان‌ها متصل شود.</p>
    <form id="config-form">
      <label for="backend-url">آدرس سرور (مثال: https://api.example.com)</label>
      <input id="backend-url" name="backendUrl" type="url" required />

      <label for="portal-url">آدرس پنل portal.ir</label>
      <input id="portal-url" name="portalUrl" type="url" required />

      <label for="token">توکن JWT</label>
      <input id="token" name="token" type="text" required />

      <button type="submit">ذخیره</button>
      <div class="status" id="status"></div>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
